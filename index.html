<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La GoGo | Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Karla:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  

  :root{
    --masa: #F2E4C6;      /* papel / fondo, tono masa cruda */
    --miga: #FFFBF2;      /* tarjetas, tono miga de pan */
    --horno: #45804a;     /* texto principal, marron horno */
    --horno-suave: #86b18b;
    --costra: #57df1c;    /* acento principal, costra tostada */
    --costra-oscura: #3ddd65;
    --sello: #A63D2C;     /* rojo sello / ticket */
    --sello-suave: #F4DCD5;
    --oliva: #bae955;     /* disponible / confirmacion */
    --oliva-suave: #E4E9D6;
    --linea: #DCC9A3;
    --menta: #92f5bf;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--masa);
    color: var(--horno);
    font-family:'Karla', sans-serif;
    padding-bottom: 100px;
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 0 18px; }

  /* -------- letrero de cabecera -------- */
  header.sign{
    background: var(--horno);
    color: var(--masa);
    padding: 34px 18px 40px;
    text-align: center;
    position: relative;
    border-bottom: 6px solid var(--costra);
  }
  header.sign .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--costra);
    margin: 0 0 6px;
  }
  header.sign h1{
    font-family:'Bitter', serif;
    font-weight: 800;
    font-size: 42px;
    margin: 0;
    letter-spacing: 1px;
  }
  header.sign p.tag{
    font-family:'Bitter', serif;
    font-style: italic;
    font-weight: 500;
    margin: 8px 0 0;
    color: #E8D9BE;
    font-size: 15px;
  }

  /* -------- categorias -------- */
  .category{ margin-top: 34px; }
  .category h2{
    font-family:'Bitter', serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .category h2::after{
    content:"";
    flex:1;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--costra-oscura) 0 6px, transparent 6px 12px);
  }

  .item{
    background: var(--miga);
    border: 1px solid var(--linea);
    border-radius: 10px;
    padding: 14px 16px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .item .info h3{
    margin:0 0 4px;
    font-family:'Bitter', serif;
    font-size: 16px;
    font-weight: 700;
  }
  .item .info p{
    margin:0;
    font-size: 13px;
    color: var(--horno-suave);
    line-height: 1.4;
  }
  .item .price{
    font-family:'Space Mono', monospace;
    font-size: 13px;
    color: var(--costra-oscura);
    margin-top: 6px;
    display:block;
  }
  .qty-control{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-shrink:0;
  }
  .qty-control button{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--costra-oscura);
    background: var(--miga);
    color: var(--costra-oscura);
    font-size: 16px;
    font-weight:700;
    cursor:pointer;
    line-height:1;
  }
  .qty-control button:active{ transform: scale(0.94); }
  .qty-control span{
    min-width: 18px;
    text-align:center;
    font-weight: 700;
    font-family:'Space Mono', monospace;
  }
  .add-btn{
    border: 1px solid var(--costra-oscura);
    background: var(--costra);
    color: var(--miga);
    padding: 7px 14px;
    border-radius: 8px;
    font-family:'Karla', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  /* -------- carrito flotante -------- */
  .cart-bar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--horno);
    color: var(--masa);
    padding: 14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 14px;
    box-shadow: 0 -4px 14px rgba(0,0,0,0.18);
    transform: translateY(110%);
    transition: transform 0.25s ease;
    z-index: 40;
  }
  .cart-bar.show{ transform: translateY(0); }
  .cart-bar .count{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    color: var(--costra);
  }
  .cart-bar .total{
    font-family:'Bitter', serif;
    font-size: 20px;
    font-weight: 800;
  }
  .cart-bar button{
    background: var(--costra);
    color: var(--horno);
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  /* -------- modal (carrito / checkout / ticket) -------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(20,12,7,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--miga);
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding: 24px 22px 28px;
    position: relative;
  }
  .sheet h2{
    font-family:'Bitter', serif;
    font-size: 22px;
    margin: 0 0 18px;
  }
  .sheet .close{
    position:absolute; top:16px; right:18px;
    background:none; border:none;
    font-size: 22px;
    color: var(--horno-suave);
    cursor:pointer;
  }

  .cart-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 0;
    border-bottom: 1px dashed var(--linea);
    font-size: 14px;
  }
  .cart-row .name{ font-weight:700; }
  .cart-row .sub{ color: var(--horno-suave); font-size: 12px; }
  .cart-total-row{
    display:flex; justify-content:space-between;
    padding-top: 16px;
    font-family:'Bitter', serif;
    font-size: 19px;
    font-weight: 800;
  }

  label{
    display:block;
    font-size: 13px;
    font-weight: 700;
    margin: 16px 0 6px;
  }
  input[type=text], input[type=tel], textarea, select{
    width:100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--linea);
    background: #fff;
    font-family:'Karla', sans-serif;
    font-size: 14px;
  }
  .radio-group{ display:flex; gap: 10px; margin-top: 4px; }
  .radio-group label.opt{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    gap:6px;
    border: 1px solid var(--linea);
    border-radius: 8px;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 700;
    margin:0;
    cursor:pointer;
    text-align:center;
  }
  .radio-group input{ accent-color: var(--costra-oscura); }
  .radio-group label.active{
    border-color: var(--costra-oscura);
    background: var(--sello-suave);
  }

  .primary-btn{
    width:100%;
    background: var(--costra);
    color: var(--horno);
    border:none;
    padding: 14px;
    border-radius: 9px;
    font-weight: 800;
    font-size: 15px;
    margin-top: 22px;
    cursor:pointer;
  }
  .primary-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* -------- ticket de confirmacion -------- */
  .ticket{
    border: 2px dashed var(--sello);
    border-radius: 12px;
    padding: 20px;
    text-align:center;
    background: #fff;
  }
  .ticket .label{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--horno-suave);
  }
  .ticket .code{
    font-family:'Space Mono', monospace;
    font-size: 28px;
    font-weight:700;
    color: var(--sello);
    margin: 8px 0 4px;
    letter-spacing: 2px;
  }
  .ticket .steps{
    text-align:left;
    margin-top: 18px;
    font-size: 13px;
    line-height: 1.6;
  }
  .ticket .steps b{ color: var(--sello); }
  .wa-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background: var(--oliva);
    color: #fff;
    padding: 13px;
    border-radius: 9px;
    font-weight: 800;
    font-size: 14px;
    margin-top: 18px;
  }
  .empty-note{
    text-align:center;
    color: var(--horno-suave);
    font-size: 13px;
    padding: 24px 0;
  }
</style>
</head>

<script>

const state = { cart: {} };

const urlParams = new URLSearchParams(window.location.search);
const tiendaParam = urlParams.get('tienda');
let currentStore = null;
if(tiendaParam){
  const storeData = CONFIG.stores[tiendaParam];
  currentStore = storeData
    ? { slug: tiendaParam, empresa: storeData.empresa, direccion: storeData.direccion }
    : { slug: tiendaParam, empresa: tiendaParam.replace(/-/g, ' '), direccion: '' };
  document.getElementById('storeWelcomeName').textContent = currentStore.empresa;
  document.getElementById('storeWelcome').style.display = 'block';
}

function money(n){
  return '$' + n.toLocaleString('es-CO');
}

function renderMenu(){
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  CONFIG.categories.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'category';
    catEl.innerHTML = `<h2>${cat.name}</h2>`;
    cat.items.forEach(item => {
      const qty = state.cart[item.id]?.qty || 0;
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <div class="info">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
          <span class="price">${money(item.price)}</span>
        </div>
        <div class="qty-holder" data-id="${item.id}"></div>
      `;
      catEl.appendChild(row);
      renderQtyControl(row.querySelector('.qty-holder'), item, qty);
    });
    menu.appendChild(catEl);
  });
}

function renderQtyControl(holder, item, qty){
  if(qty === 0){
    holder.innerHTML = `<button class="add-btn" data-add="${item.id}">Agregar</button>`;
  } else {
    holder.innerHTML = `
      <div class="qty-control">
        <button data-minus="${item.id}">-</button>
        <span>${qty}</span>
        <button data-plus="${item.id}">+</button>
      </div>
    `;
  }
}

function setQty(item, qty){
  if(qty <= 0){
    delete state.cart[item.id];
  } else {
    state.cart[item.id] = { item, qty };
  }
  renderMenu();
  renderCartBar();
}

function getItemById(id){
  for(const cat of CONFIG.categories){
    const found = cat.items.find(i => i.id === id);
    if(found) return found;
  }
  return null;
}

function cartTotal(){
  return Object.values(state.cart).reduce((sum, c) => sum + c.item.price * c.qty, 0);
}
function cartCount(){
  return Object.values(state.cart).reduce((sum, c) => sum + c.qty, 0);
}

function renderCartBar(){
  const bar = document.getElementById('cartBar');
  const count = cartCount();
  if(count === 0){
    bar.classList.remove('show');
    return;
  }
  bar.classList.add('show');
  document.getElementById('cartCount').textContent = count + (count === 1 ? ' producto' : ' productos');
  document.getElementById('cartTotalMini').textContent = money(cartTotal());
}

function renderCartSheet(){
  const list = document.getElementById('cartList');
  const entries = Object.values(state.cart);
  if(entries.length === 0){
    list.innerHTML = '<p class="empty-note">Todavia no has agregado productos.</p>';
  } else {
    list.innerHTML = entries.map(c => `
      <div class="cart-row">
        <div>
          <div class="name">${c.item.name}</div>
          <div class="sub">${c.qty} x ${money(c.item.price)}</div>
        </div>
        <div>${money(c.item.price * c.qty)}</div>
      </div>
    `).join('');
  }
  document.getElementById('cartTotalFull').textContent = money(cartTotal());
}

document.getElementById('menu').addEventListener('click', (e) => {
  const addId = e.target.dataset.add;
  const plusId = e.target.dataset.plus;
  const minusId = e.target.dataset.minus;
  if(addId){
    const item = getItemById(addId);
    setQty(item, 1);
  } else if(plusId){
    const item = getItemById(plusId);
    const current = state.cart[plusId]?.qty || 0;
    setQty(item, current + 1);
  } else if(minusId){
    const item = getItemById(minusId);
    const current = state.cart[minusId]?.qty || 0;
    setQty(item, current - 1);
  }
});

function openOverlay(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
});

document.getElementById('openCartBtn').addEventListener('click', () => {
  renderCartSheet();
  openOverlay('cartOverlay');
});

document.getElementById('goCheckoutBtn').addEventListener('click', () => {
  if(cartCount() === 0) return;
  closeOverlay('cartOverlay');
  openOverlay('checkoutOverlay');
});

document.querySelectorAll('input[name=delivery]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('#deliveryGroup .opt').forEach(o => o.classList.remove('active'));
    radio.closest('.opt').classList.add('active');
    document.getElementById('addressField').style.display = radio.value === 'domicilio' ? 'block' : 'none';
  });
});
document.querySelectorAll('input[name=payment]').forEach(radio => {
  radio.addEventListener('change', () => {
    document.querySelectorAll('#paymentGroup .opt').forEach(o => o.classList.remove('active'));
    radio.closest('.opt').classList.add('active');
  });
});

function generateOrderCode(){
  const today = new Date();
  const dd = String(today.getDate()).padStart(2, '0');
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const rand = Math.floor(1000 + Math.random() * 9000);
  return `GOGO-${dd}${mm}-${rand}`;
}

document.getElementById('confirmOrderBtn').addEventListener('click', () => {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const delivery = document.querySelector('input[name=delivery]:checked').value;
  const address = document.getElementById('custAddress').value.trim();
  const payment = document.querySelector('input[name=payment]:checked').value;

  if(!name || !phone){
    alert('Por favor escribe tu nombre y numero de celular.');
    return;
  }
  if(delivery === 'domicilio' && !address){
    alert('Por favor escribe la direccion de entrega.');
    return;
  }

  const code = generateOrderCode();
  const total = cartTotal();
  const itemsText = Object.values(state.cart)
    .map(c => `- ${c.qty} x ${c.item.name} (${money(c.item.price * c.qty)})`)
    .join('\n');

  const deliveryText = delivery === 'domicilio'
    ? `Domicilio: ${address}`
    : `Recoger en: ${CONFIG.pickupAddress}`;

  const paymentText = payment === 'transferencia'
    ? `Pago: transferencia (${CONFIG.bankInfo})`
    : 'Pago: efectivo contraentrega';

  const message = [
    `Pedido ${CONFIG.businessName} - codigo ${code}`,
    `Cliente: ${name} (${phone})`,
    '',
    itemsText,
    '',
    `Total: ${money(total)}`,
    deliveryText,
    paymentText
  ].join('\n');

  document.getElementById('ticketCode').textContent = code;
  document.getElementById('ticketSteps').innerHTML = payment === 'transferencia'
    ? `1. Realiza la transferencia por <b>${money(total)}</b>.<br>2. Envia el comprobante junto con este codigo por WhatsApp para que empecemos a preparar tu pedido.`
    : `1. Presiona el boton de abajo para enviarnos tu pedido por WhatsApp.<br>2. Paga en efectivo cuando recibas o recojas tu pedido.`;

  const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`;
  document.getElementById('waLink').href = waUrl;

 if(CONFIG.sheetWebhookUrl){
    const itemsArray = Object.values(state.cart).map(c => ({
      cant: c.qty,
      producto: c.item.name,
      vrUnit: c.item.price,
      vrTotal: c.item.price * c.qty
    }));
    fetch(CONFIG.sheetWebhookUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        codigo: code,
        cliente: name,
        celular: phone,
        items: itemsArray,
        total: total,
        entrega: delivery,
        direccion: address,
        pago: payment,
        fecha: new Date().toISOString(),
        empresa: currentStore ? currentStore.empresa : '',
        direccionEmpresa: currentStore ? currentStore.direccion : ''
      })
    }).catch(() => {});
  }

  closeOverlay('checkoutOverlay');
  openOverlay('ticketOverlay');

  state.cart = {};
  renderMenu();
  renderCartBar();
});

renderMenu();
renderCartBar();
</script>

</body>
</html>
